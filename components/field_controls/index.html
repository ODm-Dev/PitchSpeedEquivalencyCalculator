<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pitch speed controls</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #ff4b4b;
      --secondary: #f0f2f6;
      --text: #31333f;
      --muted: rgba(49, 51, 63, 0.6);
      --bg: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Source Sans Pro", "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    #root { overflow: hidden; }
    .field { margin: 0 0 0.4rem; }
    .label-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .field-label {
      margin: 0;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--text);
    }
    .scroller {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-padding-inline: 50%;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 1px max(12px, calc(50% - 72px)) 3px;
    }
    .scroller::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .pill {
      flex: 0 0 auto;
      scroll-snap-align: center;
      min-height: 44px;
      padding: 0 14px;
      border: none;
      border-radius: 999px;
      background: var(--secondary);
      color: var(--text);
      font: inherit;
      font-size: 15px;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pill-name { font-weight: 600; }
    .pill-meta {
      margin-left: 0.4rem;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
    }
    .pill[aria-checked="true"] {
      background: var(--primary);
      color: #ffffff;
    }
    .pill[aria-checked="true"] .pill-meta { color: rgba(255, 255, 255, 0.92); }
    .pill:focus { outline: none; }
    .pill:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
    .nudges {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
    }
    .nudge {
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
    }
    .nudge:hover, .nudge:focus-visible { background: var(--secondary); color: var(--text); }
    .nudge:focus { outline: none; }
    .nudge:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
    .nudge:disabled { opacity: 0.35; cursor: default; background: transparent; }
    .nudge-value {
      min-width: 4.6rem;
      text-align: center;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .custom-nudges { margin: -0.15rem 0 0.15rem; }
    .swap-wrap { margin: 0 0 0.4rem; }
    .swap {
      min-height: 44px;
      padding: 0.25rem 0.85rem;
      border: none;
      border-radius: 0.5rem;
      background: var(--secondary);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    .swap:focus { outline: none; }
    .swap:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const SPOKEN_LEVEL = { HS: "High school", College: "College", MLB: "MLB" };
    let cfg = null;
    let current = null;
    let booted = false;
    let scrollBehavior = "auto";
    let gesture = null;

    function post(type, extra) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra), "*");
    }

    function esc(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function clone(value) { return JSON.parse(JSON.stringify(value)); }

    function sameState(a, b) {
      if (!a || !b) return false;
      return Number(a.speed) === Number(b.speed)
        && a.from_preset === b.from_preset
        && a.to_preset === b.to_preset
        && Math.abs(Number(a.from_feet) - Number(b.from_feet)) < 0.001
        && Math.abs(Number(a.to_feet) - Number(b.to_feet)) < 0.001;
    }

    function applyTheme(theme) {
      if (!theme) return;
      const root = document.documentElement;
      if (theme.primaryColor) root.style.setProperty("--primary", theme.primaryColor);
      if (theme.secondaryBackgroundColor) root.style.setProperty("--secondary", theme.secondaryBackgroundColor);
      if (theme.textColor) root.style.setProperty("--text", theme.textColor);
      if (theme.backgroundColor) {
        root.style.setProperty("--bg", theme.backgroundColor);
        document.body.style.background = theme.backgroundColor;
      }
      try {
        const font = getComputedStyle(window.parent.document.body).fontFamily;
        if (font) document.body.style.fontFamily = font;
      } catch (err) { /* The frame can still use the fallback font. */ }
    }

    function readStorage() {
      try {
        const raw = localStorage.getItem(cfg.storage_key);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object" || parsed.speed == null) return null;
        return parsed;
      } catch (err) { return null; }
    }

    function writeStorage(state) {
      try { localStorage.setItem(cfg.storage_key, JSON.stringify(state)); }
      catch (err) { /* The visit still works if storage is blocked. */ }
    }

    function send(state) {
      post("streamlit:setComponentValue", { value: state, dataType: "json" });
    }

    function snap(feet) {
      const min = Number(cfg.distance_min);
      const max = Number(cfg.distance_max);
      const step = Number(cfg.distance_step);
      let x = Math.min(max, Math.max(min, Number(feet)));
      const steps = Math.floor((x - min) / step + 0.5 + 1e-8);
      let snapped = min + steps * step;
      if (snapped > max) snapped = max;
      if (snapped < min) snapped = min;
      return Math.round(snapped * 1000) / 1000;
    }

    function feetShort(feet) {
      feet = Number(feet);
      if (Math.abs(feet - 60.5) < 1e-6) return "60'6\"";
      if (Math.abs(feet - Math.round(feet)) < 1e-6) return Math.round(feet) + " ft";
      return feet.toFixed(1) + " ft";
    }

    function feetSpoken(feet) {
      feet = Number(feet);
      if (Math.abs(feet - 60.5) < 1e-6) return "60 feet 6 inches";
      if (Math.abs(feet - Math.round(feet)) < 1e-6) return Math.round(feet) + " feet";
      return feet.toFixed(1) + " feet";
    }

    function levelSpoken(id) { return SPOKEN_LEVEL[id] || id; }

    function fit() {
      const root = document.getElementById("root");
      post("streamlit:setFrameHeight", { height: Math.ceil(root.getBoundingClientRect().height) + 2 });
    }

    function centerInScroller(scroller, target, behavior) {
      if (!scroller || !target) return;
      const left = target.offsetLeft - (scroller.clientWidth - target.offsetWidth) / 2;
      if (behavior === "smooth") scroller.scrollTo({ left: Math.max(0, left), behavior: "smooth" });
      else scroller.scrollLeft = Math.max(0, left);
    }

    function centerSelected(behavior) {
      document.querySelectorAll(".scroller").forEach(function (scroller) {
        let target = scroller.querySelector('[aria-checked="true"]');
        if (!target && scroller.dataset.row === "speed") {
          const speed = Number(current.speed);
          let best = null;
          let bestDiff = Infinity;
          scroller.querySelectorAll("[data-speed]").forEach(function (el) {
            const diff = Math.abs(Number(el.dataset.speed) - speed);
            if (diff < bestDiff) { best = el; bestDiff = diff; }
          });
          target = best;
        }
        centerInScroller(scroller, target, behavior);
      });
    }

    function pill(attrs, name, meta, checked) {
      const tab = checked ? "0" : "-1";
      return '<button type="button" class="pill" role="radio" aria-checked="' + (checked ? "true" : "false") + '" tabindex="' + tab + '"' + attrs + '>'
        + '<span class="pill-name">' + esc(name) + '</span>'
        + (meta ? '<span class="pill-meta">' + esc(meta) + '</span>' : '')
        + '</button>';
    }

    function moundRow(side) {
      const selected = current[side + "_preset"];
      const buttons = cfg.presets.map(function (preset) {
        const checked = selected === preset.id;
        const label = levelSpoken(preset.id) + ", " + feetSpoken(preset.feet);
        const attrs = ' data-action="preset" data-side="' + side + '" data-preset="' + esc(preset.id) + '" aria-label="' + esc(label) + '"';
        return pill(attrs, preset.id, feetShort(preset.feet), checked);
      }).join("");
      const customChecked = selected === "custom";
      const customMeta = customChecked ? feetShort(current[side + "_feet"]) : "";
      const customAttrs = ' data-action="custom" data-side="' + side + '" data-preset="custom" aria-label="Custom ' + side + ' distance"';
      return buttons + pill(customAttrs, "Custom", customMeta, customChecked);
    }

    function customStepper(side) {
      if (current[side + "_preset"] !== "custom") return "";
      const feet = Number(current[side + "_feet"]);
      const atMin = feet <= Number(cfg.distance_min) + 1e-6;
      const atMax = feet >= Number(cfg.distance_max) - 1e-6;
      return '<div class="nudges custom-nudges">'
        + '<button type="button" class="nudge" data-action="distance-down" data-side="' + side + '" aria-label="Decrease ' + side + ' distance by half a foot"' + (atMin ? " disabled" : "") + '>&minus;</button>'
        + '<span class="nudge-value">' + esc(feetShort(feet)) + '</span>'
        + '<button type="button" class="nudge" data-action="distance-up" data-side="' + side + '" aria-label="Increase ' + side + ' distance by half a foot"' + (atMax ? " disabled" : "") + '>+</button>'
        + '</div>';
    }

    function paint() {
      const root = document.getElementById("root");
      const speed = Number(current.speed);
      const atSlow = speed <= Number(cfg.speed_min);
      const atFast = speed >= Number(cfg.speed_max);
      const chips = cfg.speed_chips.map(function (mph) {
        const checked = speed === Number(mph);
        const attrs = ' data-action="chip" data-speed="' + mph + '" aria-label="' + mph + ' miles per hour"';
        return pill(attrs, String(mph), "", checked);
      }).join("");
      root.innerHTML = ''
        + '<section class="field">'
        + '<p class="field-label" id="from-label">From</p>'
        + '<div class="scroller" data-row="from" role="radiogroup" aria-labelledby="from-label">' + moundRow("from") + '</div>'
        + customStepper("from")
        + '</section>'
        + '<div class="swap-wrap"><button type="button" class="swap" data-action="swap" aria-label="Swap from and to distances">Swap distances</button></div>'
        + '<section class="field">'
        + '<p class="field-label" id="to-label">To</p>'
        + '<div class="scroller" data-row="to" role="radiogroup" aria-labelledby="to-label">' + moundRow("to") + '</div>'
        + customStepper("to")
        + '</section>'
        + '<section class="field">'
        + '<div class="label-line">'
        + '<p class="field-label" id="speed-label">Pitch velo</p>'
        + '<div class="nudges">'
        + '<button type="button" class="nudge" data-action="speed-down" aria-label="Decrease pitch speed by 1 mile per hour"' + (atSlow ? " disabled" : "") + '>&minus;</button>'
        + '<span class="nudge-value">' + speed + ' mph</span>'
        + '<button type="button" class="nudge" data-action="speed-up" aria-label="Increase pitch speed by 1 mile per hour"' + (atFast ? " disabled" : "") + '>+</button>'
        + '</div></div>'
        + '<div class="scroller" data-row="speed" role="radiogroup" aria-labelledby="speed-label">' + chips + '</div>'
        + '</section>';
      centerSelected(scrollBehavior);
      requestAnimationFrame(fit);
    }

    function commit(next) {
      next.rev = ((current && current.rev) || 0) + 1;
      current = next;
      scrollBehavior = "smooth";
      writeStorage(current);
      paint();
      scrollBehavior = "auto";
      send(current);
    }

    function selectPill(button) {
      if (!button || button.disabled || !current || !cfg) return;
      const action = button.dataset.action;
      const side = button.dataset.side;
      const next = clone(current);
      if (action === "preset") {
        const preset = cfg.presets.find(function (item) { return item.id === button.dataset.preset; });
        if (!preset) return;
        next[side + "_preset"] = preset.id;
        next[side + "_feet"] = preset.feet;
      } else if (action === "custom") {
        if (current[side + "_preset"] === "custom") return;
        next[side + "_preset"] = "custom";
      } else if (action === "distance-down" || action === "distance-up") {
        const delta = action === "distance-up" ? Number(cfg.distance_step) : -Number(cfg.distance_step);
        next[side + "_preset"] = "custom";
        next[side + "_feet"] = snap(Number(current[side + "_feet"]) + delta);
      } else if (action === "speed-down" || action === "speed-up") {
        const delta = action === "speed-up" ? 1 : -1;
        next.speed = Math.min(Number(cfg.speed_max), Math.max(Number(cfg.speed_min), Number(current.speed) + delta));
      } else if (action === "chip") {
        next.speed = Number(button.dataset.speed);
      } else if (action === "swap") {
        next.from_preset = current.to_preset;
        next.from_feet = current.to_feet;
        next.to_preset = current.from_preset;
        next.to_feet = current.from_feet;
      } else {
        return;
      }
      if (sameState(next, current) && action !== "swap") return;
      commit(next);
    }

    function onPointerDown(event) {
      const scroller = event.target.closest(".scroller");
      if (!scroller) { gesture = null; return; }
      gesture = {
        x: event.clientX,
        y: event.clientY,
        scroll: scroller.scrollLeft,
        moved: false
      };
    }

    function onPointerMove(event) {
      if (!gesture || gesture.moved) return;
      const dx = Math.abs(event.clientX - gesture.x);
      const dy = Math.abs(event.clientY - gesture.y);
      if (dx > 10 || dy > 10) gesture.moved = true;
    }

    function onClick(event) {
      const scroller = event.target.closest(".scroller");
      const scrolled = gesture && scroller && Math.abs(scroller.scrollLeft - gesture.scroll) > 4;
      if (gesture && (gesture.moved || scrolled)) {
        event.preventDefault();
        event.stopPropagation();
        gesture = null;
        return;
      }
      gesture = null;
      selectPill(event.target.closest("button"));
    }

    function onKeyDown(event) {
      const scroller = event.target.closest(".scroller");
      if (!scroller) return;
      const keys = ["ArrowRight", "ArrowLeft", "Home", "End"];
      if (keys.indexOf(event.key) === -1) return;
      const pills = Array.prototype.slice.call(scroller.querySelectorAll("[role='radio']"));
      if (!pills.length) return;
      let index = pills.indexOf(document.activeElement);
      if (index < 0) index = pills.findIndex(function (pill) { return pill.getAttribute("aria-checked") === "true"; });
      if (index < 0) index = 0;
      let next = index;
      if (event.key === "ArrowRight") next = Math.min(pills.length - 1, index + 1);
      if (event.key === "ArrowLeft") next = Math.max(0, index - 1);
      if (event.key === "Home") next = 0;
      if (event.key === "End") next = pills.length - 1;
      event.preventDefault();
      gesture = null;
      pills[next].focus();
      selectPill(pills[next]);
    }

    function onRender(args) {
      applyTheme(args.theme);
      cfg = args;
      const incoming = args.state;
      if (!incoming) return;
      if (!booted) {
        booted = true;
        const stored = readStorage();
        if (stored && !sameState(stored, incoming)) {
          current = stored;
          paint();
          send(current);
          return;
        }
        current = clone(stored || incoming);
        writeStorage(current);
        paint();
        return;
      }
      if ((Number(incoming.rev) || 0) < ((current && Number(current.rev)) || 0)) return;
      if (sameState(incoming, current)) return;
      current = clone(incoming);
      writeStorage(current);
      paint();
    }

    const root = document.getElementById("root");
    root.addEventListener("pointerdown", onPointerDown);
    root.addEventListener("pointermove", onPointerMove);
    root.addEventListener("click", onClick);
    root.addEventListener("keydown", onKeyDown);
    window.addEventListener("resize", function () {
      centerSelected("auto");
      fit();
    });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        centerSelected("auto");
        fit();
      });
    }
    if (window.ResizeObserver) {
      new ResizeObserver(fit).observe(root);
    }
    window.addEventListener("message", function (event) {
      const data = event.data;
      if (!data || data.type !== "streamlit:render") return;
      onRender(data.args || {});
    });
    post("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
