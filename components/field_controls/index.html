<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pitch speed controls</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #ff4b4b;
      --secondary: #f0f2f6;
      --text: #31333f;
      --muted: rgba(49, 51, 63, 0.6);
      --bg: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Source Sans Pro", "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    #root { overflow: hidden; }
    .field { margin: 0 0 0.85rem; }
    .field-label {
      margin: 0 0 0.15rem;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--text);
    }
    .scroller {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-padding-inline: 50%;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px max(12px, calc(50% - 88px)) 4px;
    }
    .scroller::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .pill {
      flex: 0 0 auto;
      scroll-snap-align: center;
      min-height: 44px;
      padding: 4px 14px;
      border: none;
      border-radius: 999px;
      background: var(--secondary);
      color: var(--text);
      font: inherit;
      font-size: 15px;
      line-height: 1.15;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pill-name { font-weight: 600; }
    .pill-meta {
      margin-left: 0.4rem;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
    }
    .pill[aria-checked="true"] {
      background: var(--primary);
      color: #ffffff;
    }
    .pill[aria-checked="true"] .pill-meta { color: rgba(255, 255, 255, 0.92); }
    .pill:focus { outline: none; }
    .pill:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
    .inputs {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.15rem 1.25rem;
    }
    @media (min-width: 720px) {
      .inputs { grid-template-columns: 1fr 1fr; }
    }
    .stepper {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .step, .step-value {
      min-height: 48px;
      border: none;
      border-radius: 0.5rem;
      background: var(--secondary);
      color: var(--text);
      font: inherit;
    }
    .step {
      flex: 0 0 64px;
      min-width: 64px;
      font-size: 1.75rem;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .step:focus { outline: none; }
    .step:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .step:disabled { opacity: 0.35; cursor: default; }
    .step-value {
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
      text-align: center;
      font-size: 1.35rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      padding: 0 8px;
    }
    .step-value:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const HOLD_MS = 400;
    let cfg = null;
    let current = null;
    let booted = false;
    let scrollBehavior = "auto";
    let gesture = null;
    let hold = null;
    let editing = false;
    let dirty = false;

    function post(type, extra) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra), "*");
    }

    function esc(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function clone(value) { return JSON.parse(JSON.stringify(value)); }

    function sameState(a, b) {
      if (!a || !b) return false;
      return Number(a.speed) === Number(b.speed)
        && Math.abs(Number(a.distance) - Number(b.distance)) < 0.001;
    }

    function applyTheme(theme) {
      if (!theme) return;
      const root = document.documentElement;
      if (theme.primaryColor) root.style.setProperty("--primary", theme.primaryColor);
      if (theme.secondaryBackgroundColor) root.style.setProperty("--secondary", theme.secondaryBackgroundColor);
      if (theme.textColor) root.style.setProperty("--text", theme.textColor);
      if (theme.backgroundColor) {
        root.style.setProperty("--bg", theme.backgroundColor);
        document.body.style.background = theme.backgroundColor;
      }
      try {
        const font = getComputedStyle(window.parent.document.body).fontFamily;
        if (font) document.body.style.fontFamily = font;
      } catch (err) { /* The frame can still use the fallback font. */ }
    }

    function readStorage() {
      try {
        const raw = localStorage.getItem(cfg.storage_key);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object" || parsed.speed == null || parsed.distance == null) return null;
        return parsed;
      } catch (err) { return null; }
    }

    function writeStorage(state) {
      try { localStorage.setItem(cfg.storage_key, JSON.stringify(state)); }
      catch (err) { /* The visit still works if storage is blocked. */ }
    }

    function send(state) {
      post("streamlit:setComponentValue", { value: state, dataType: "json" });
    }

    function snapSpeed(value) {
      const min = Number(cfg.speed_min);
      const max = Number(cfg.speed_max);
      let snapped = Math.floor(Number(value) + 0.5 + 1e-8);
      if (!isFinite(snapped)) snapped = min;
      return Math.min(max, Math.max(min, snapped));
    }

    function snapDist(feet) {
      const min = Number(cfg.distance_min);
      const max = Number(cfg.distance_max);
      const step = Number(cfg.distance_step);
      let x = Math.min(max, Math.max(min, Number(feet)));
      if (!isFinite(x)) x = min;
      const steps = Math.floor((x - min) / step + 0.5 + 1e-8);
      let snapped = min + steps * step;
      if (snapped > max) snapped = max;
      if (snapped < min) snapped = min;
      return Math.round(snapped * 1000) / 1000;
    }

    function formatSpeed(speed) { return String(snapSpeed(speed)); }

    function formatDist(feet) {
      feet = snapDist(feet);
      if (Math.abs(feet - Math.round(feet)) < 1e-6) return String(Math.round(feet));
      return feet.toFixed(1);
    }

    function feetSpoken(feet) {
      feet = Number(feet);
      if (Math.abs(feet - Math.round(feet)) < 1e-6) return Math.round(feet) + " feet";
      return feet.toFixed(1) + " feet";
    }

    function matchingPreset() {
      if (!cfg || !current) return null;
      return (cfg.presets || []).find(function (preset) {
        return Number(preset.speed) === Number(current.speed)
          && Math.abs(Number(preset.distance) - Number(current.distance)) < 0.001;
      }) || null;
    }

    function fit() {
      const root = document.getElementById("root");
      post("streamlit:setFrameHeight", { height: Math.ceil(root.getBoundingClientRect().height) + 2 });
    }

    function centerInScroller(scroller, target, behavior) {
      if (!scroller || !target) return;
      const left = target.offsetLeft - (scroller.clientWidth - target.offsetWidth) / 2;
      if (behavior === "smooth") scroller.scrollTo({ left: Math.max(0, left), behavior: "smooth" });
      else scroller.scrollLeft = Math.max(0, left);
    }

    function centerSelected(behavior) {
      const scroller = document.querySelector(".scroller");
      if (!scroller) return;
      centerInScroller(scroller, scroller.querySelector('[aria-checked="true"]'), behavior);
    }

    function flush() {
      if (!dirty || !current) return;
      dirty = false;
      current.rev = (Number(current.rev) || 0) + 1;
      writeStorage(current);
      send(current);
    }

    function syncControls() {
      const speedInput = document.querySelector("[data-field=speed]");
      const distInput = document.querySelector("[data-field=distance]");
      if (speedInput && document.activeElement !== speedInput) speedInput.value = formatSpeed(current.speed);
      if (distInput && document.activeElement !== distInput) distInput.value = formatDist(current.distance);
      const match = matchingPreset();
      document.querySelectorAll("[data-preset]").forEach(function (pill) {
        const on = match && pill.dataset.preset === match.id;
        pill.setAttribute("aria-checked", on ? "true" : "false");
        pill.tabIndex = on ? 0 : -1;
      });
      if (!hold) {
        const speed = Number(current.speed);
        const distance = Number(current.distance);
        const speedDown = document.querySelector("[data-step=speed-down]");
        const speedUp = document.querySelector("[data-step=speed-up]");
        const distDown = document.querySelector("[data-step=distance-down]");
        const distUp = document.querySelector("[data-step=distance-up]");
        if (speedDown) speedDown.disabled = speed <= Number(cfg.speed_min);
        if (speedUp) speedUp.disabled = speed >= Number(cfg.speed_max);
        if (distDown) distDown.disabled = distance <= Number(cfg.distance_min) + 1e-6;
        if (distUp) distUp.disabled = distance >= Number(cfg.distance_max) - 1e-6;
      }
    }

    function assign(speed, distance, sendNow) {
      const next = { speed: snapSpeed(speed), distance: snapDist(distance), rev: current.rev };
      if (sameState(next, current)) {
        syncControls();
        return;
      }
      current.speed = next.speed;
      current.distance = next.distance;
      dirty = true;
      syncControls();
      if (sendNow) flush();
    }

    function deltaFor(action, big) {
      if (action === "speed-down") return big ? -Number(cfg.speed_hold) : -Number(cfg.speed_step);
      if (action === "speed-up") return big ? Number(cfg.speed_hold) : Number(cfg.speed_step);
      if (action === "distance-down") return big ? -Number(cfg.distance_hold) : -Number(cfg.distance_step);
      if (action === "distance-up") return big ? Number(cfg.distance_hold) : Number(cfg.distance_step);
      return 0;
    }

    function applyStep(action, big, sendNow) {
      const delta = deltaFor(action, big);
      if (action.indexOf("speed") === 0) assign(Number(current.speed) + delta, current.distance, sendNow);
      else assign(current.speed, Number(current.distance) + delta, sendNow);
    }

    function clearHoldTimer() {
      if (!hold) return;
      clearTimeout(hold.timer);
      hold.timer = null;
    }

    function endHold(applyTap) {
      if (!hold) return;
      clearHoldTimer();
      const fired = hold.fired;
      const action = hold.action;
      hold = null;
      if (applyTap && !fired) applyStep(action, false, true);
      else if (fired) flush();
      syncControls();
    }

    function paint() {
      const root = document.getElementById("root");
      const pills = (cfg.presets || []).map(function (preset) {
        const checked = matchingPreset() && matchingPreset().id === preset.id;
        const label = preset.id + ", " + preset.speed + " miles per hour at " + feetSpoken(preset.distance);
        const meta = preset.speed + " mph · " + formatDist(preset.distance) + " ft";
        return '<button type="button" class="pill" role="radio" data-preset="' + esc(preset.id) + '" aria-checked="' + (checked ? "true" : "false") + '" tabindex="' + (checked ? "0" : "-1") + '" aria-label="' + esc(label) + '">'
          + '<span class="pill-name">' + esc(preset.id) + '</span>'
          + '<span class="pill-meta">' + esc(meta) + '</span>'
          + '</button>';
      }).join("");
      root.innerHTML = ''
        + '<section class="field">'
        + '<p class="field-label" id="preset-label">Select Preset</p>'
        + '<div class="scroller" role="radiogroup" aria-labelledby="preset-label">' + pills + '</div>'
        + '</section>'
        + '<div class="inputs">'
        + '<section class="field">'
        + '<p class="field-label" id="speed-label">Pitch Velo (mph)</p>'
        + '<div class="stepper">'
        + '<button type="button" class="step" data-step="speed-down" aria-label="Decrease pitch velocity by 1 mile per hour. Hold for 5.">&minus;</button>'
        + '<input class="step-value" data-field="speed" inputmode="decimal" enterkeyhint="done" autocomplete="off" aria-labelledby="speed-label" value="' + esc(formatSpeed(current.speed)) + '">'
        + '<button type="button" class="step" data-step="speed-up" aria-label="Increase pitch velocity by 1 mile per hour. Hold for 5.">+</button>'
        + '</div></section>'
        + '<section class="field">'
        + '<p class="field-label" id="distance-label">Release Distance (ft)</p>'
        + '<div class="stepper">'
        + '<button type="button" class="step" data-step="distance-down" aria-label="Decrease release distance by half a foot. Hold for 5 feet.">&minus;</button>'
        + '<input class="step-value" data-field="distance" inputmode="decimal" enterkeyhint="done" autocomplete="off" aria-labelledby="distance-label" value="' + esc(formatDist(current.distance)) + '">'
        + '<button type="button" class="step" data-step="distance-up" aria-label="Increase release distance by half a foot. Hold for 5 feet.">+</button>'
        + '</div></section>'
        + '</div>';
      syncControls();
      centerSelected(scrollBehavior);
      requestAnimationFrame(fit);
    }

    function selectPreset(id) {
      const preset = (cfg.presets || []).find(function (item) { return item.id === id; });
      if (!preset) return;
      assign(preset.speed, preset.distance, true);
      scrollBehavior = "smooth";
      centerSelected("smooth");
      scrollBehavior = "auto";
    }

    function onPointerDown(event) {
      const step = event.target.closest("[data-step]");
      if (step) {
        if (step.disabled || hold) return;
        event.preventDefault();
        try { step.setPointerCapture(event.pointerId); } catch (err) { /* capture is optional */ }
        hold = { action: step.dataset.step, fired: false, pointerId: event.pointerId, timer: null };
        const tick = function () {
          if (!hold) return;
          hold.fired = true;
          applyStep(hold.action, true, false);
          hold.timer = setTimeout(tick, HOLD_MS);
        };
        hold.timer = setTimeout(tick, HOLD_MS);
        return;
      }
      const scroller = event.target.closest(".scroller");
      if (!scroller) { gesture = null; return; }
      gesture = { x: event.clientX, y: event.clientY, scroll: scroller.scrollLeft, moved: false };
    }

    function onPointerMove(event) {
      if (!gesture || gesture.moved) return;
      if (Math.abs(event.clientX - gesture.x) > 10 || Math.abs(event.clientY - gesture.y) > 10) gesture.moved = true;
    }

    function onPointerUp(event) {
      if (hold && event.pointerId === hold.pointerId) {
        endHold(true);
        return;
      }
    }

    function onPointerCancel(event) {
      if (hold && event.pointerId === hold.pointerId) endHold(false);
    }

    function onClick(event) {
      const step = event.target.closest("[data-step]");
      if (step) {
        if (event.detail === 0) applyStep(step.dataset.step, false, true);
        event.preventDefault();
        return;
      }
      const scroller = event.target.closest(".scroller");
      const scrolled = gesture && scroller && Math.abs(scroller.scrollLeft - gesture.scroll) > 4;
      if (gesture && (gesture.moved || scrolled)) {
        event.preventDefault();
        event.stopPropagation();
        gesture = null;
        return;
      }
      gesture = null;
      const pill = event.target.closest("[data-preset]");
      if (pill) selectPreset(pill.dataset.preset);
    }

    function onKeyDown(event) {
      const scroller = event.target.closest(".scroller");
      if (!scroller) return;
      const keys = ["ArrowRight", "ArrowLeft", "Home", "End"];
      if (keys.indexOf(event.key) === -1) return;
      const pills = Array.prototype.slice.call(scroller.querySelectorAll("[role='radio']"));
      if (!pills.length) return;
      let index = pills.indexOf(document.activeElement);
      if (index < 0) index = pills.findIndex(function (pill) { return pill.getAttribute("aria-checked") === "true"; });
      if (index < 0) index = 0;
      let next = index;
      if (event.key === "ArrowRight") next = Math.min(pills.length - 1, index + 1);
      if (event.key === "ArrowLeft") next = Math.max(0, index - 1);
      if (event.key === "Home") next = 0;
      if (event.key === "End") next = pills.length - 1;
      event.preventDefault();
      gesture = null;
      pills[next].focus();
      selectPreset(pills[next].dataset.preset);
    }

    function commitField(input) {
      if (!input || !current) return;
      const raw = String(input.value).replace(/[^0-9.]/g, "");
      const parsed = parseFloat(raw);
      if (!isFinite(parsed)) {
        syncControls();
        return;
      }
      if (input.dataset.field === "speed") assign(parsed, current.distance, true);
      else assign(current.speed, parsed, true);
    }

    function onFocusIn(event) {
      if (event.target.matches && event.target.matches("[data-field]")) {
        editing = true;
        const input = event.target;
        setTimeout(function () { try { input.select(); } catch (err) { /* selection can fail on some phones */ } }, 0);
      }
    }

    function onFocusOut(event) {
      if (event.target.matches && event.target.matches("[data-field]")) {
        editing = false;
        commitField(event.target);
      }
    }

    function onFieldKey(event) {
      if (event.target.matches && event.target.matches("[data-field]") && event.key === "Enter") {
        event.preventDefault();
        event.target.blur();
      }
    }

    function onContextMenu(event) {
      if (event.target.closest("[data-step]")) event.preventDefault();
    }

    function onRender(args) {
      applyTheme(args.theme);
      cfg = args;
      const incoming = args.state;
      if (!incoming || incoming.speed == null || incoming.distance == null) return;
      if (hold || editing) return;
      if (!booted) {
        booted = true;
        const stored = readStorage();
        if (stored && !sameState(stored, incoming)) {
          current = { speed: snapSpeed(stored.speed), distance: snapDist(stored.distance), rev: Number(stored.rev) || 0 };
          paint();
          dirty = true;
          flush();
          return;
        }
        current = {
          speed: snapSpeed((stored || incoming).speed),
          distance: snapDist((stored || incoming).distance),
          rev: Number((stored || incoming).rev) || 0
        };
        writeStorage(current);
        paint();
        return;
      }
      if ((Number(incoming.rev) || 0) < (Number(current.rev) || 0)) return;
      const normalized = { speed: snapSpeed(incoming.speed), distance: snapDist(incoming.distance), rev: current.rev };
      if (sameState(normalized, current)) return;
      current = { speed: normalized.speed, distance: normalized.distance, rev: Number(incoming.rev) || 0 };
      writeStorage(current);
      paint();
    }

    const root = document.getElementById("root");
    root.addEventListener("pointerdown", onPointerDown);
    root.addEventListener("pointermove", onPointerMove);
    root.addEventListener("pointerup", onPointerUp);
    root.addEventListener("pointercancel", onPointerCancel);
    root.addEventListener("click", onClick);
    root.addEventListener("keydown", onKeyDown);
    root.addEventListener("focusin", onFocusIn);
    root.addEventListener("focusout", onFocusOut);
    root.addEventListener("keydown", onFieldKey);
    root.addEventListener("contextmenu", onContextMenu);
    window.addEventListener("resize", function () {
      centerSelected("auto");
      fit();
    });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { centerSelected("auto"); fit(); });
    }
    if (window.ResizeObserver) new ResizeObserver(fit).observe(root);
    window.addEventListener("message", function (event) {
      const data = event.data;
      if (!data || data.type !== "streamlit:render") return;
      onRender(data.args || {});
    });
    post("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
